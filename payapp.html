<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Pay application</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231F5FD6%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-family=%22Arial%22 font-size=%2226%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3EPA%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#F3F6FB;--surface:#FFFFFF;--ink:#0D1B2E;--muted:#56657C;--line:#DDE4EE;--accent:#1F5FD6;--accent-soft:#E6EEFC;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
#app{padding:24px 16px 48px}
.pa-load{max-width:980px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;text-align:center;color:var(--muted)}
.pa-load h1{font-size:20px;color:var(--ink);margin:0 0 8px}
@media print{ body{background:#fff} #app{padding:0} }
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="payapp_form.js"></script>
</head>
<body>
<main id="app"><div class="pa-load"><h1>Loading your pay application…</h1></div></main>
<script>
(async function(){
  const app=document.getElementById("app");
  const msg=(title,text)=>{ app.innerHTML=""; const d=document.createElement("div"); d.className="pa-load"; const h=document.createElement("h1"); h.textContent=title; const p=document.createElement("p"); p.textContent=text; d.append(h,p); app.append(d); };
  const CFG=window.APP_CONFIG||{};
  if(!CFG.supabaseUrl || /PASTE/.test(CFG.supabaseUrl) || !window.supabase || !window.PayAppForm){ msg("Not available yet","This pay application page isn’t set up yet. Contact the general contractor who sent you the link."); return; }
  const t=new URL(location.href).searchParams.get("t")||"";
  if(!/^[0-9a-f]{32,80}$/i.test(t)){ msg("This link isn’t complete","Copy the whole link from the message you received, or ask the general contractor to send it again."); return; }
  const sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});
  let res; try{ res=await sb.rpc("payapp_get",{p_token:t}); }catch(e){ res={error:e}; }
  if(res.error){ msg("Can’t load it right now","Check your internet connection and reload this page."); return; }
  const model=res.data;
  if(!model){ msg("This link isn’t valid","It may have been cancelled. Ask the general contractor to send you a new link."); return; }
  document.title="Pay application #"+(model.appNo||"")+" · "+(model.gcName||"");
  window.PayAppForm.mount(app, model, {draftKey:"payapp."+t.slice(0,16), onSubmit: async payload=>{
    const r=await sb.rpc("payapp_submit",{p_token:t, p_sub:payload});
    if(r.error){ const e=new Error(r.error.message||"error");
      if(/payapp_closed/.test(e.message)) e.userMessage="This pay application was already submitted or closed. Reload the page to see it, or ask for a new link.";
      else if(/payapp_invalid/.test(e.message)) e.userMessage="Some information is missing. Check your company name, your name and the line items.";
      else if(/payapp_not_found/.test(e.message)) e.userMessage="This link was cancelled. Ask the general contractor for a new one.";
      throw e; }
  }});
})();
</script>
</body>
</html>
