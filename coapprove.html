<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Change order approval</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231B2550%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-family=%22Arial%22 font-size=%2226%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3ECO%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#F3F5F9;--surface:#FFFFFF;--ink:#111A2E;--muted:#58647A;--line:#DCE2EC;--navy:#1B2550;--accent:#1F5FD6;--accent-soft:#E8EFFD;--ok:#16794A;--ok-soft:#E3F4EA;--no:#B4232F;--no-soft:#FBE9EB;--warn-soft:#FFF4D6;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
#app{max-width:860px;margin:0 auto;padding:20px 16px 140px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.load{text-align:center;color:var(--muted);margin-top:40px}
.load h1{font-size:20px;color:var(--ink);margin:0 0 8px}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.co img{max-height:44px;max-width:180px;display:block;margin-bottom:8px}
.co b{display:block;font-size:16px}
.co span{display:block;color:var(--muted);font-size:13px}
.ttl{text-align:right}
.ttl h1{margin:0;font-size:22px;letter-spacing:.02em;color:var(--navy)}
.ttl .meta{color:var(--muted);font-size:13.5px;margin-top:4px}
.round{display:inline-block;margin-top:8px;background:var(--warn-soft);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.msg{background:var(--accent-soft);border-radius:10px;padding:12px 14px;margin-top:14px;white-space:pre-wrap}
.msg b{display:block;margin-bottom:2px}
h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin:0 0 10px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px}
.kv div span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kv div b{font-weight:600}
.scope{white-space:pre-wrap;margin:0}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bulk .hint{color:var(--muted);font-size:13px;margin-left:auto}
.line{border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;transition:border-color .15s,background .15s}
.line.yes{border-color:var(--ok);background:#FAFEFB}
.line.no{border-color:var(--no);background:#FFFBFB}
.lhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.lhead .d b{display:block;font-size:15.5px}
.lhead .d small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.lhead .amt{font-weight:700;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.prevtag{display:inline-block;margin-top:6px;font-size:12px;border-radius:999px;padding:2px 9px;background:#EEF1F6;color:var(--muted)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.choice button{font:600 15px var(--body);padding:11px 10px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:46px}
.choice button[data-v=yes][aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.choice button[data-v=no][aria-pressed=true]{background:var(--no);border-color:var(--no);color:#fff}
.choice button:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{margin-top:10px}
.note label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
textarea,input[type=text],input[type=email]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:64px;resize:vertical}
.btn{font:600 15px var(--body);padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:7px 0;border-bottom:1px solid var(--line)}
td.r{text-align:right;white-space:nowrap;padding-left:12px}
tr.big td{font-weight:700;border-bottom:0;font-size:16px}
tr.strike td.r{color:var(--muted);text-decoration:line-through}
.small{font-size:12.5px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fields label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.agree{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:10px;background:#F6F8FB}
.agree input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--navy)}
.err{color:var(--no);font-weight:600;margin:10px 0 0;min-height:1em}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(17,26,46,.08);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:860px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar .sum b{font-size:17px;font-variant-numeric:tabular-nums}
.bar .sum span{display:block;font-size:12.5px;color:var(--muted)}
.done{text-align:center}
.done .mark{width:56px;height:56px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:6px auto 10px}
.res{margin-top:12px;text-align:left}
.res .ln{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.yes{background:var(--ok-soft);color:var(--ok)}
.pill.no{background:var(--no-soft);color:var(--no)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
@media (max-width:560px){ .ttl{text-align:left} .lhead{flex-direction:column;gap:4px} }
@media print{ body{background:#fff} .bar,.bulk,.choice,.no-print{display:none!important} #app{padding:0} .card{border:0;padding:8px 0} }
</style>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main id="app"><div class="card load"><h1>Loading the change order…</h1></div></main>
<script>
(function(){
const app=document.getElementById("app");
const h=(t,a,...k)=>{ const e=document.createElement(t); for(const [x,v] of Object.entries(a||{})){ if(v==null||v===false) continue; if(x==="text") e.textContent=v; else if(x.startsWith("on")) e.addEventListener(x.slice(2),v); else e.setAttribute(x,v===true?"":v); } for(const c of k.flat()) if(c!=null&&c!==false) e.append(c.nodeType? c : document.createTextNode(String(c))); return e; };
const msg=(t,x)=>{ app.replaceChildren(h("div",{class:"card load"},h("h1",{text:t}),h("p",{text:x}))); };
const num=v=>{ const n=parseFloat(String(v==null?"":v).replace(/[$,\s]/g,"")); return isFinite(n)? n : 0; };
const r2=n=>{ const a=Math.round(Math.round(Math.abs(n)*10000)/100)/100; return n<0 && a? -a : a; };
const money=n=>{ n=r2(num(n)); const s="$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); return n<0? "("+s+")" : s; };
const dUS=s=>{ const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||"")); return m? (+m[2])+"/"+(+m[3])+"/"+m[1] : ""; };
const dLong=s=>{ const d=new Date(s); return isNaN(d)? "" : d.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"}); };
const CFG=window.APP_CONFIG||{};
if(!CFG.supabaseUrl || /PASTE/.test(CFG.supabaseUrl) || !window.supabase){ msg("Not available yet","This approval page isn’t set up yet. Contact the contractor who sent you the link."); return; }
const tok=new URL(location.href).searchParams.get("t")||"";
if(!/^[0-9a-f]{32,80}$/i.test(tok)){ msg("This link isn’t complete","Copy the whole link from the message you received, or ask the contractor to send it again."); return; }
const sb=window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{persistSession:false, autoRefreshToken:false, detectSessionInUrl:false}});

// the change order total for the lines the owner approves: fees as % of the approved lines, fixed fees only when something is approved
function calc(co, dec){
  const items=co.items||[]; const yes=items.filter(it=>dec[it.id]===true);
  const sub=r2(yes.reduce((a,it)=>a+num(it.amount),0));
  const fees=(co.fees||[]).map(f=>({name:f.name, label:f.label, amount: f.mode==="amt"? (yes.length? r2(num(f.value)) : 0) : r2(sub*num(f.value)/100)}));
  const total=r2(sub+fees.reduce((a,f)=>a+f.amount,0));
  return {yes, sub, fees, total, revised:r2(num(co.orig)+num(co.prev)+total)};
}

function header(co, round){
  const c=co.company||{};
  return h("section",{class:"card"},
    h("div",{class:"top"},
      h("div",{class:"co"}, c.logo? h("img",{src:c.logo,alt:""}) : null, h("b",{text:c.name||""}),
        [c.address1,c.address2,c.phone? "Phone: "+c.phone : "",c.website].filter(Boolean).map(t=>h("span",{text:t}))),
      h("div",{class:"ttl"}, h("h1",{text:"CHANGE ORDER "+(co.no||"")}),
        h("div",{class:"meta",text:[co.projectName, co.date? dUS(co.date) : ""].filter(Boolean).join(" · ")}),
        round>1? h("span",{class:"round",text:"Updated version · review "+round}) : null)));
}
function details(co){
  const o=co.owner||{};
  const rows=[["Project",[co.projectName,...(co.projectAddr||[])].filter(Boolean).join(", ")],["Owner",[o.company,o.name].filter(Boolean).join(" · ")],
    ["Contract #",co.contractNo],["Contract date",dUS(co.contractDate)],["Reason for change",co.reason],["Requested by",co.requestedBy],["Project no.",co.projectNo]].filter(r=>r[1]);
  const docs=co.docs||{}; const att=[docs.drawings&&"Drawings / sketches",docs.proposal&&"Proposal / quotes",docs.photos&&"Photos",docs.other&&("Other: "+docs.other)].filter(Boolean);
  return h("section",{class:"card"},
    h("div",{class:"kv"}, rows.map(([k,v])=>h("div",null,h("span",{text:k}),h("b",{text:v})))),
    att.length? h("p",{class:"small",style:"margin:12px 0 0",text:"Supporting documents: "+att.join(", ")+". Ask the contractor if you didn’t receive them."}) : null);
}
function contractTable(co, c){
  return h("section",{class:"card"},h("h2",{text:"Contract sum"}),
    h("table",null,h("tbody",null,
      h("tr",null,h("td",{text:"Original contract sum"}),h("td",{class:"r",text:money(co.orig)})),
      h("tr",null,h("td",{text:"Net change by previously approved change orders"}),h("td",{class:"r",text:money(co.prev)})),
      h("tr",{class:"big"},h("td",{text:"New contract sum prior to this change order"}),h("td",{class:"r",text:money(num(co.orig)+num(co.prev))})),
      h("tr",null,h("td",{text:"This change order, lines you approve"}),h("td",{class:"r",id:"ctThis",text:money(c.total)})))));
}

function renderForm(data){
  const co=data.co||{}, prev=data.prev||{}, round=num(data.round)||1;
  const dec={}, notes={};
  for(const it of co.items||[]) if(prev[it.id]){ notes[it.id]=""; }
  const lines=h("div");
  const sumB=h("b"), sumS=h("span"), send=h("button",{class:"btn primary",type:"button",text:"Send my approval"});
  const update=()=>{ const c=calc(co,dec); const n=(co.items||[]).length, done=Object.keys(dec).filter(k=>dec[k]!=null).length;
    sumB.textContent=money(c.total); sumS.textContent=c.yes.length+" of "+n+" lines approved"+(done<n? " · "+(n-done)+" still to decide" : "");
    const t=document.getElementById("ctThis"); if(t) t.textContent=money(c.total); const nw=document.getElementById("ctNew"); if(nw) nw.textContent=money(c.revised);
    const fs=document.getElementById("feeRows"); if(fs) fs.replaceChildren(...feeRows(c)); };
  const feeRows=c=>[h("tr",null,h("td",{text:"Lines you approve"}),h("td",{class:"r",text:money(c.sub)})), ...c.fees.map(f=>h("tr",null,h("td",{text:f.label||f.name||"Fee"}),h("td",{class:"r",text:money(f.amount)}))), h("tr",{class:"big"},h("td",{text:"Total of this change order"}),h("td",{class:"r",text:money(c.total)}))];
  const drawLine=(it,i)=>{
    const box=h("div",{class:"line",id:"ln-"+it.id});
    const set=v=>{ const er=document.querySelector("#app .err"); if(er) er.textContent=""; dec[it.id]=v; box.className="line"+(v===true?" yes":v===false?" no":""); yes.setAttribute("aria-pressed",String(v===true)); no.setAttribute("aria-pressed",String(v===false)); note.hidden= v!==false && !noteTa.value; update(); };
    const yes=h("button",{type:"button","data-v":"yes","aria-pressed":"false",onclick:()=>set(true)},"Approve");
    const no=h("button",{type:"button","data-v":"no","aria-pressed":"false",onclick:()=>set(false)},"Decline");
    const noteTa=h("textarea",{id:"nt-"+it.id,rows:"2",placeholder:"Optional: tell the contractor why, or what you’d accept"});
    noteTa.addEventListener("input",()=>{ notes[it.id]=noteTa.value; });
    const note=h("div",{class:"note"},h("label",{for:"nt-"+it.id,text:"Comment on this line"}),noteTa); note.hidden=true;
    const p=prev[it.id];
    const sub=[it.csi, it.cat, (String(it.qty||"").trim()? it.qty+" "+(it.unit||"")+" × "+money(it.rate) : "")].filter(Boolean).join(" · ");
    box.append(h("div",{class:"lhead"},
      h("div",{class:"d"},h("b",{text:(i+1)+". "+(it.desc||"Line "+(i+1))}),sub? h("small",{text:sub}) : null,
        p? h("span",{class:"prevtag",text: p.ok? "You approved this last time" : "You declined this last time"+(p.note? ": “"+p.note+"”" : "")}) : null),
      h("div",{class:"amt",text:money(it.amount)})),
      h("div",{class:"choice",role:"group","aria-label":"Line "+(i+1)},yes,no), note);
    return box;
  };
  (co.items||[]).forEach((it,i)=>lines.append(drawLine(it,i)));
  const name=h("input",{type:"text",id:"aName",autocomplete:"name"}), title=h("input",{type:"text",id:"aTitle",autocomplete:"organization-title"}), email=h("input",{type:"email",id:"aEmail",autocomplete:"email"});
  const gen=h("textarea",{id:"aNote",rows:"3",placeholder:"Anything else for the contractor (optional)"});
  const agree=h("input",{type:"checkbox",id:"aAgree"});
  const err=h("p",{class:"err",role:"alert"});
  const c0=calc(co,dec);
  const setAll=v=>{ for(const it of co.items||[]){ const b=document.querySelector("#ln-"+it.id+" button[data-v="+(v?"yes":"no")+"]"); if(b) b.click(); } };
  app.replaceChildren(
    header(co, round),
    data.note? h("section",{class:"card"},h("div",{class:"msg",style:"margin:0"},h("b",{text:"Message from "+((co.company||{}).name||"the contractor")}),data.note)) : null,
    details(co),
    h("section",{class:"card"},h("h2",{text:"Approve or decline each line"}),
      h("div",{class:"bulk"},h("button",{class:"btn",type:"button",onclick:()=>setAll(true)},"Approve all"),h("button",{class:"btn",type:"button",onclick:()=>setAll(false)},"Decline all"),
        h("span",{class:"hint",text:"You can approve some lines and decline others."})),
      lines,
      h("table",{style:"margin-top:8px"},h("tbody",{id:"feeRows"},...feeRows(c0))),
      (co.fees||[]).some(f=>f.mode!=="amt")? h("p",{class:"small",style:"margin:8px 0 0",text:"Percentage fees are figured on the lines you approve."}) : null),
    contractTable(co, c0),
    h("section",{class:"card"},h("h2",{text:"Your approval"}),
      h("div",{class:"fields"},
        h("div",null,h("label",{for:"aName",text:"Full name *"}),name),
        h("div",null,h("label",{for:"aTitle",text:"Title"}),title),
        h("div",null,h("label",{for:"aEmail",text:"Email"}),email)),
      h("div",{style:"margin-top:12px"},h("label",{for:"aNote",class:"small",text:"Note to the contractor"}),gen),
      h("label",{class:"agree",for:"aAgree"},agree,h("span",{text:"I’m authorized to approve this change order for the owner. I approve the lines marked Approve, and I don’t approve the lines marked Decline. Typing my name above serves as my signature."})),
      err),
    h("p",{class:"foot",text:"Sent by "+String((co.company||{}).name||"your contractor").replace(/\.$/,"")+". This page shows only this change order."}),
    h("div",{class:"bar"},h("div",{class:"in"},h("div",{class:"sum"},h("span",{text:"Total of the lines you approve"}),sumB,sumS),send)));
  update();
  send.addEventListener("click",async()=>{
    err.textContent="";
    const miss=(co.items||[]).find(it=>dec[it.id]==null);
    if(miss){ err.textContent="Choose Approve or Decline for every line. Line "+((co.items||[]).indexOf(miss)+1)+" is still open."; document.getElementById("ln-"+miss.id).scrollIntoView({behavior:"smooth",block:"center"}); return; }
    if(!name.value.trim()){ err.textContent="Type your full name."; name.focus(); return; }
    if(email.value.trim() && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim())){ err.textContent="That email doesn’t look right."; email.focus(); return; }
    if(!agree.checked){ err.textContent="Tick the box to confirm your approval."; agree.focus(); return; }
    const decisions={}; for(const it of co.items||[]) decisions[it.id]={ok:dec[it.id]===true, note:(notes[it.id]||"").trim()};
    send.disabled=true; send.textContent="Sending…";
    const { error } = await sb.rpc("coapproval_submit",{p_token:tok, p_resp:{name:name.value.trim(), title:title.value.trim(), email:email.value.trim(), note:gen.value.trim(), agree:true, decisions}});
    if(error){ send.disabled=false; send.textContent="Send my approval";
      err.textContent= /closed/.test(error.message)? "This change order was already answered or the link was stopped. Refresh the page to see it." : "It didn’t send. Check your connection and try again."; return; }
    load();
  });
}

function renderDone(data){
  const co=data.co||{}, r=data.response||{}, dec=r.decisions||{};
  const d={}; for(const k in dec) d[k]=!!dec[k].ok;
  const c=calc(co,d);
  const head= data.status==="closed" && data.outcome==="accepted"? "This change order is approved" : data.status==="stopped"? "This link was stopped" : "Thank you, your answer was sent";
  app.replaceChildren(header(co, num(data.round)||1),
    h("section",{class:"card done"},h("div",{class:"mark","aria-hidden":"true",text:"✓"}),h("h1",{style:"margin:0 0 6px;font-size:21px",text:head}),
      h("p",{style:"margin:0;color:var(--muted)",text: r.at? (r.name||"You")+(r.title? ", "+r.title : "")+" approved "+(r.approved||0)+" of "+(r.lines||0)+" lines on "+dLong(r.at)+"." : ""}),
      data.status==="responded"? h("p",{class:"small",text:"The contractor will review your answer. If they change any lines, you’ll get the same link to review again."}) : null,
      h("div",{class:"res"}, (co.items||[]).map((it,i)=>{ const x=dec[it.id]||{}; return h("div",{class:"ln"},h("div",null,h("b",{text:(i+1)+". "+(it.desc||"")}),x.note? h("div",{class:"small",text:"“"+x.note+"”"}) : null),
          h("div",{style:"text-align:right"},h("div",{text:money(it.amount)}),h("span",{class:"pill "+(x.ok?"yes":"no"),text:x.ok?"Approved":"Declined"}))); }),
        h("table",{style:"margin-top:10px"},h("tbody",null,h("tr",{class:"big"},h("td",{text:"Total of approved lines"}),h("td",{class:"r",text:money(c.total)}))))),
      h("p",{class:"no-print",style:"margin-top:14px"},h("button",{class:"btn",type:"button",onclick:()=>print()},"Print or save as PDF"))));
}

async function load(){
  const { data, error } = await sb.rpc("coapproval_get",{p_token:tok});
  if(error){ msg("Couldn’t load the change order","Check your connection and refresh the page."); return; }
  if(!data){ msg("This link isn’t valid","It may have been replaced. Ask the contractor to send the change order again."); return; }
  document.title="Change order "+((data.co||{}).no||"")+" · approval";
  if(data.status==="sent") renderForm(data);
  else if(data.status==="stopped") msg("This link was stopped","The contractor stopped this approval request. Ask them if you need a new link.");
  else renderDone(data);
}
load();
})();
</script>
</body>
</html>
